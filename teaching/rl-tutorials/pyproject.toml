# Packages for running the Reinforcement Learning tutorials (1-7) on your own computer
# with uv (https://docs.astral.sh/uv/). In the folder that holds this file:
#
#   uv run jupyter lab
#
# uv installs a suitable Python if needed, creates the environment (.venv) next to this
# file, and starts Jupyter.
[project]
name = "rl-tutorials"
version = "2025.26"
description = "Packages for running the Reinforcement Learning tutorials on your own computer"
requires-python = ">=3.11,<3.14"
dependencies = [
    "torch==2.8.0",
    "gymnasium[classic-control,other]==1.2.1",
    "stable-baselines3==2.7.0",
    "optuna==4.5.0",
    "numpy==2.3.3",
    "pandas==2.3.3",
    "matplotlib==3.10.6",
    "seaborn==0.13.2",
    "tqdm==4.67.1",
    "jupyterlab==4.4.9",
]

# PyTorch comes from its CPU-only index (the tutorials do not use a GPU; on Linux and
# Windows the default build bundles CUDA, about 2 GB). Only torch is taken from there.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
