capacity=memory_size, device=self.device)\n\n        self.policy_optimizer = torch.optim.Adam(self.policy_net.parameters(), lr=self.lr_actor)\n        self.critic_optimizer = torch.optim.Adam(self.value_fun.parameters(), lr=self.lr_critic)\n\n    def _compute_returns(self, rewards: torch.Tensor) -> torch.Tensor:\n        G = torch.zeros_like(rewards)\n        cumulative = 0.0\n        for t in reversed(range(len(rewards))):\n            cumulative = rewards[t] + self.discount_factor * cumulative\n            G[t] = cumulative\n        return G\n\n    def _compute_loss(self) -> torch.Tensor:\n        # Implement this method\n        pass\n\n    def update(self) -> bool:\n        # Only update at the end of an episode\n        _, _, _, _, done = self.buf.latest()\n        if done:\n            loss = self._compute_loss()\n            # Add optimization step\n            self.buf.clear()  # clear buffer after update\n            return True\n        return False\n", "intro": true}, {"t": "code", "src": "import torch\nimport gymnasium as gym\nfrom algorithms.control.basepgagent import BasePGAgent\nfrom util.rollout_buffer import RolloutBuffer\n\n\nclass ActorCriticAgent(BasePGAgent):\n    \"\"\"\n    One-step Actor-Critic agent that integrates the trainer logic.\n\n    This implements a simple one-step actor-critic update where the critic\n    estimates V(s) and actor is updated with the TD(0) advantage.\n\n    Note that the standard formulation of the A2C algorithm\n    assumes memory_size=1, that is the update rule is applied every timestep.\n    If memory_size > 1 then this is not the case and the agent will wait\n    until the rolloutbuffer is filled.\n    \"\"\"\n\n    def __init__(self,\n                 state_space: gym.spaces.Box,\n                 action_space: gym.spaces.Box,\n                 learning_rate_actor: float = 1e-4,\n                 learning_rate_critic: float = 1e-3,\n                 discount_factor: float = 0.99,\n                 memory_size: int = 1,\n                 batch_size: int = 1):\n        super().__init__(state_space, action_space, learning_rate_actor, learning_rate_critic, discount_factor)\n\n        self.batch_size = int(batch_size)\n        self._memory_size = memory_size\n\n        self.buf = RolloutBuffer(capacity=memory_size, device=self.device)\n\n        self.policy_optimizer = torch.optim.Adam(self.policy_net.parameters(), lr=self.lr_actor)\n        self.value_optimizer = torch.optim.Adam(self.value_fun.parameters(), lr=self.lr_critic)\n\n    def _compute_loss(self) -> torch.Tensor:\n        # Implement this method\n        # Note that the buffer yields a mini-batch of trajectories e.g.\n        # for states, actions, rewards, next_states, dones in self.buf.get(self.batch_size):\n        pass\n\n    def update(self) -> bool:\n        # Train when the buffer is filled\n        if len(self.buf) >= self._memory_size:\n            loss = self._compute_loss()\n            # Add optimization step\n            self.buf.clear()  # clear after update\n            return True\n\n        return False\n", "intro": true}, {"t": "md", "md": "### Training and evaluation\n\nThe training loop is `env_interaction` from `main.py`; it records the return of each episode in a `MetricsTracker`.", "intro": true}, {"t": "code", "src": "import gymnasium as gym\nfrom loguru import logger\nfrom util.metrictracker import MetricsTracker\n\n\ndef env_interaction(env_str: str,\n                    agent_type: str,\n                    num_episodes: int,\n                    tracker: MetricsTracker,\n                    learning_rate_actor: float,\n                    learning_rate_critic: float) -> None:\n    \"\"\"\n    Train RL algorithms and track performance.\n\n    :param env_str: environment name as a string.\n    :param agent_type: type of agent to be trained.\n    :param num_episodes: number of training episodes.\n    :param tracker: tracks performance of behavioral policy.\n    :param learning_rate_actor: learning rate for policy approximation.\n    :param learning_rate_critic: learning rate for value function approximation.\n    \"\"\"\n    logger.info(f\"Training {agent_type} on {env_str} for {num_episodes} episodes.\")\n\n    env = gym.make(env_str, render_mode='rgb_array')\n    \n    obs_space = env.observation_space\n    action_space = env.action_space\n    agent = None\n    if agent_type == \"ACTOR-CRITIC-AGENT\":\n        agent = ActorCriticAgent(obs_space, action_space,\n                                 learning_rate_actor=learning_rate_actor,\n                                 learning_rate_critic=learning_rate_critic)\n    elif agent_type == \"REINFORCE\":\n        agent = ReinforceAgent(obs_space, action_space,\n                               learning_rate_actor=learning_rate_actor,\n                               learning_rate_critic=learning_rate_critic)\n    else:\n        raise ValueError(\"Invalid agent type\")\n\n    for episode in range(num_episodes):\n        episode_return = 0\n        obs, info = env.reset()\n\n        # Start episode loop\n        while True:\n            action = agent.policy(obs)\n            next_obs, reward, terminated, truncated, info = env.step(action)\n\n            agent.add_transition(obs, action, reward, next_obs, terminated or truncated)\n            agent.update()\n\n            episode_return += reward\n            obs = next_obs\n\n            if terminated or truncated:\n                # Record episodic return for the policy\n                logger.info(f\"Episode finished, {episode_return}\")\n                tracker.record_metric(\n                    metric_name=\"return\",\n                    agent_id=agent_type,\n                    idx=episode,\n                    value=episode_return\n                )\n                break\n\n    env.close()\n", "intro": true}, {"t": "md", "md": "Choose the learning rates of each algorithm and a number of training episodes that ensures convergence for both, then plot the rt RolloutBuffer\n\n\nclass ActorCriticAgent(BasePGAgent):\n    \"\"\"\n    One-step Actor-Critic agent that integrates the trainer logic.\n\n    This implements a simple one-step actor-critic update where the critic\n    estimates V(s) and actor is updated with the TD(0) advantage.\n\n    Note that the standard formulation of the A2C algorithm\n    assumes memory_size=1, that is the update rule is applied every timestep.\n    If memory_size > 1 then this is not the case and the agent will wait\n    until the rolloutbuffer is filled.\n    \"\"\"\n\n    def __init__(self,\n                 state_space: gym.spaces.Box,\n                 action_space: gym.spaces.Box,\n                 learning_rate_actor: float = 1e-4,\n                 learning_rate_critic: float = 1e-3,\n                 discount_factor: float = 0.99,\n                 memory_size: int = 1,\n                 batch_size: int = 1):\n        super().__init__(state_space, action_space, learning_rate_actor, learning_rate_critic, discount_factor)\n\n        self.batch_size = int(batch_size)\n        self._memory_size = memory_size\n\n        self.buf = RolloutBuffer(capacity=memory_size, device=self.device)\n\n        self.policy_optimizer = torch.optim.Adam(self.policy_net.parameters(), lr=self.lr_actor)\n        self.value_optimizer = torch.optim.Adam(self.value_fun.parameters(), lr=self.lr_critic)\n\n    def _compute_loss(self) -> torch.Tensor:\n        # Implement this method\n        # Note that the buffer yields a mini-batch of trajectories e.g.\n        # for states, actions, rewards, next_states, dones in self.buf.get(self.batch_size):\n        pass\n\n    def update(self) -> bool:\n        # Train when the buffer is filled\n        if len(self.buf) >= self._memory_size:\n            loss = self._compute_loss()\n            # Add optimization step\n            self.buf.clear()  # clear after update\n            return True\n\n        return False\n"}, {"cell_type": "markdown", "source": "### Training and evaluation\n\nThe training loop is `env_interaction` from `main.py`; it records the return of each episode in a `MetricsTracker`."}, {"cell_type": "code", "source": "import gymnasium as gym\nfrom loguru import logger\nfrom util.metrictracker import MetricsTracker\n\n\ndef env_interaction(env_str: str,\n                    agent_type: str,\n                    num_episodes: int,\n                    tracker: MetricsTracker,\n                    learning_rate_actor: float,\n                    learning_rate_critic: float) -> None:\n    \"\"\"\n    Train RL algorithms and track performance.\n\n    :param env_str: environment name as a string.\n    :param agent_type: type of agent to be trained.\n    :param num_episodes: number of training episodes.\n    :param tracker: tracks performance of behavioral policy.\n    :param learning_rate_actor: learning rate for policy approximation.\n    :param learning_rate_critic: learning rate for value function approximation.\n    \"\"\"\n    logger.info(f\"Training {agent_type} on {env_str} for {num_episodes} episodes.\")\n\n    env = gym.make(env_str, render_mode='rgb_array')\n    \n    obs_space = env.observation_space\n    action_space = env.action_space\n    agent = None\n    if agent_type == \"ACTOR-CRITIC-AGENT\":\n        agent = ActorCriticAgent(obs_space, action_space,\n                                 learning_rate_actor=learning_rate_actor,\n                                 learning_rate_critic=learning_rate_critic)\n    elif agent_type == \"REINFORCE\":\n        agent = ReinforceAgent(obs_space, action_space,\n                               learning_rate_actor=learning_rate_actor,\n                               learning_rate_critic=learning_rate_critic)\n    else:\n        raise ValueError(\"Invalid agent type\")\n\n    for episode in range(num_episodes):\n        episode_return = 0\n        obs, info = env.reset()\n\n        # Start episode loop\n        while True:\n            action = agent.policy(obs)\n            next_obs, reward, terminated, truncated, info = env.step(action)\n\n            agent.add_transition(obs, action, reward, next_obs, terminated or truncated)\n            agent.update()\n\n            episode_return += reward\n            obs = next_obs\n\n            if terminated or truncated:\n                # Record episodic return for the policy\n                logger.info(f\"Episode finished, {episode_return}\")\n                tracker.record_metric(\n                    metric_name=\"return\",\n                    agent_id=agent_type,\n                    idx=episode,\n                    value=episode_return\n                )\n                break\n\n    env.close()\n"}, {"cell_type": "markdown", "source": "Choose the learning rates of each algorithm and a number of training episodes that ensures convergence for both, then plot the return across runs."}, {"cell_type": "code", "source": "tracker = MetricsTracker()\n\nnum_runs = 1\nn_episodes = 50\nlearning_rates = {\"REINFORCE\": (1e-4, 1e-3), \"ACTOR-CRITIC-AGENT\": (1e-4, 1e-3)}   # (actor, critic)\n\nfor _ in range(num_runs):\n    tracker.start_new_run()\n    for agent_type, (lr_actor, lr_critic) in learning_rates.items():\n        env_interaction(\"InvertedPendulum-v5\", agent_type, n_episodes, tracker,\n                        learning_rate_actor=lr_actor, learning_rate_critic=lr_critic)\n"}, {"cell_type": "code", "source": "import matplotlib.pyplot as plt\ntracker.plot_metric(\"return\", \"return.png\")\nplt.figure(figsize=(8, 6.4)); plt.imshow(plt.imread(\"return.png\")); plt.axis(\"off\")\nplt.show()\n"}, {"cell_type": "markdown", "source": "## (b) PPO\n\nTrain the PPO algorithm from the Stable Baselines3 library on the Inverted Pendulum environment by completing `train_ppo`. When creating the model, select an appropriate `learning_rate` and `total_timesteps` (the other hyperparameters can stay at their defaults); see the [PPO documentation](https://stable-baselines3.readthedocs.io/en/master/modules/ppo.html). To keep track of the return, pass the `MetricsTracker` to a `MetricsTrackerCallback` and give the callback to PPO's `learn` method."}, {"cell_type": "code", "source": "import gymnasium as gym\nfrom loguru import logger\nfrom stable_baselines3 import PPO\nfrom stable_baselines3.common.callbacks import StopTrainingOnMaxEpisodes\nfrom util.metricstrackercallback import MetricsTrackerCallback\nfrom util.metrictracker import MetricsTracker\n\n\ndef train_ppo(env_str: str, tracker: MetricsTracker, num_episodes: int) -> None:\n    \"\"\"\n    Train your PPO algorithm here and track performance using MetricsTracker.\n    Use the MetricsTrackerCallback when running the learn method.\n    \n    :param env_str: environment name as a string.\n    :param tracker: metric tracker.\n    :param num_episodes:\n    \"\"\"\n    logger.info(f\"Training PPO on {env_str}\")\n\n    env = gym.make(env_str, render_mode='rgb_array')\n\n    # Define the callbacks\n    metrics_tracker_callback = MetricsTrackerCallback(tracker)\n    max_episode_callback = StopTrainingOnMaxEpisodes(max_episodes=num_episodes, verbose=0)\n\n    # add code here\n\n    env.close()\n"}, {"cell_type": "code", "source": "tracker_ppo = MetricsTracker()\ntracker_ppo.start_new_run()\n\ntrain_ppo(\"InvertedPendulum-v5\", tracker_ppo, num_episodes=50)\n"}, {"cell_type": "code", "source": "import matplotlib.pyplot as plt\ntracker_ppo.plot_metric(\"return\", \"return_ppo.png\")\nplt.figure(figsize=(8, 6.4)); plt.imshow(plt.imread(\"return_ppo.png\")); plt.axis(\"off\")\nplt.show()\n"}, {"cell_type": "markdown", "source": "## Try it\n\nUse this cell to look at intermediate results, for example the actor and critic losses during training, or the return of an evaluation run after training."}, {"cell_type": "code", "source": "# Your checks here\n"}], "credit_md": "© 2025–2026 Rafael Fernandes Cunha. Text licensed under [CC BY 4.0](https://creativecommons.org/licenses/by/4.0/); code licensed under the [MIT Lice
