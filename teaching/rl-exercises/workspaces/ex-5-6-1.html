_policy.\")\n", "intro": true}, {"t": "code", "src": "import numpy as np\nfrom algorithms.control.tabularagent import TabularAgent\n\n\nclass DoubleQLearningAgent(TabularAgent):\n    def __init__(self, state_space, action_space, learning_rate=0.1, discount_rate=0.9, epsilon=0.1):\n        super().__init__(state_space, action_space, learning_rate, discount_rate)\n        self.q_table_1 = np.zeros([state_space.n, action_space.n])\n        self.q_table_2 = np.zeros([state_space.n, action_space.n])\n        self.epsilon = epsilon\n        self.agent_type = 'DOUBLE-Q-LEARNING'\n\n    def update(self, transition: tuple) -> None:\n        raise NotImplementedError(\"Implement Double Q-learning update rule.\")\n\n    def behavior_policy(self, state) -> int:\n        raise NotImplementedError(\"Implement behavior_policy.\")\n\n    def target_policy(self, state) -> int:\n        raise NotImplementedError(\"Implement target_policy.\")\n", "intro": true}, {"t": "md", "md": "### Training and evaluation\n\nThe training loop is `env_interaction` from `main.py`: it trains one agent and records the return of the behavior policy and of the target policy in two `MetricsTracker`s.", "intro": true}, {"t": "code", "src": "import copy\nimport gymnasium as gym\nfrom loguru import logger\nfrom algorithms.control.randomagent import RandomAgent\nfrom util.evaluation import evaluate_target_policy\nfrom util.metrictracker import MetricsTracker\n\n\ndef env_interaction(env_str: str,\n                    agent_type: str,\n                    num_episodes: int,\n                    behavioral_tracker: MetricsTracker,\n                    target_tracker: MetricsTracker,\n                    epsilon: float,\n                    learning_rate: float) -> None:\n    \"\"\"\n    Train your tabular algorithms here and track performance using MetricsTracker.\n    \"\"\"\n    logger.info(f\"Training {agent_type} on {env_str} for {num_episodes} episodes.\")\n\n    # Create environment and a copy for evaluation purposes\n    env = gym.make(env_str, render_mode='rgb_array', max_episode_steps=1_00)\n    eval_env = copy.deepcopy(env)\n\n    # Instantiate our RL agent\n    obs_space = env.observation_space\n    action_space = env.action_space\n    agent = None\n    if agent_type == \"SARSA\":\n        agent = SarsaAgent(obs_space, action_space, epsilon=epsilon, learning_rate=learning_rate)\n    elif agent_type == \"Q-LEARNING\":\n        agent = QLearningAgent(obs_space, action_space, epsilon=epsilon, learning_rate=learning_rate)\n    elif agent_type == \"DOUBLE-Q-LEARNING\":\n        agent = DoubleQLearningAgent(obs_space, action_space, epsilon=epsilon, learning_rate=learning_rate)\n    elif agent_type == \"RANDOM\":\n        agent = RandomAgent(obs_space, action_space)\n    else:\n        raise ValueError(\"Unsupported agent type\")\n\n    for episode in range(num_episodes):\n        episode_return = 0\n        obs, info = env.reset()\n\n        # Start episode loop\n        while True:\n            action = agent.behavior_policy(obs)\n            next_obs, reward, terminated, truncated, info = env.step(action)\n\n            # Consider falling from the Cliff as a terminal state\n            if reward == -100:\n                terminated = True\n\n            agent.update((obs, action, reward, next_obs))\n\n            episode_return += reward\n            obs = next_obs\n\n            if terminated or truncated:\n                # Record episodic return for the behavioral policy\n                behavioral_tracker.record_metric(\n                    metric_name=\"return\",\n                    agent_id=agent.agent_type,\n                    idx=episode,\n                    value=episode_return\n                )\n\n                # Evaluate target policy and record its return\n                evaluate_target_policy(eval_env, agent, target_tracker, episode_idx=episode)\n                break\n\n    env.close()\n    eval_env.close()\n", "intro": true}, {"t": "md", "md": "Consider $\\epsilon = 0.1$. Choose the learning rate of each algorithm and a number of training episodes that ensures convergence for all three, then plot the returns of the behavior policy and of the target policy.", "intro": true}, {"t": "code", "src": "tracker_behavior = MetricsTracker()\ntracker_target = MetricsTracker()\n\nnum_runs = 1\nn_episodes = 40\nlearning_rates = {\"SARSA\": 0.1, \"Q-LEARNING\": 0.1, \"DOUBLE-Q-LEARNING\": 0.1}\n\nfor _ in range(num_runs):\n    tracker_behavior.start_new_run()\n    tracker_target.start_new_run()\n    for agent_type, learning_rate in learning_rates.items():\n        env_interaction(\"CliffWalking-v1\", agent_type, n_episodes, tracker_behavior, tracker_target,\n                        epsilon=0.1, learning_rate=learning_rate)\n", "intro": true}, {"t": "code", "src": "import matplotlib.pyplot as plt\ntracker_behavior.plot_metric(\"return\", \"return_behavior.png\")\nplt.figure(figsize=(8, 6.4)); plt.imshow(plt.imread(\"return_behavior.png\")); plt.axis(\"off\")\ntracker_target.plot_metric(\"return\", \"return_target.png\")\nplt.figure(figsize=(8, 6.4)); plt.imshow(plt.imread(\"return_target.png\")); plt.axis(\"off\")\nplt.show()\n", "intro": true}, {"t": "md", "md": "## (b) DQN\n\nDQN needs PyTorch, which does not run in the browser: part (b) has its own workspace, which runs on a free mybinder.org server. [Open the DQN workspace](ex-5-6-1-dqn.html).", "intro": true}, {"t": "md", "md": "## Try it\n\nUse this cell to look at intermediate results, for example the greedy action of each agent in each cell of the grid.", "intro": true}, {"t": "code", "src": "# Your checks here\n", "intro": true}], "raw": [{"cell_type": "markdown", "source": "# Exercise 5.6.1: code workspace\n\nPart (a) of [Exercise 5.6.1](/teaching/rl-exercises/cliff-walking-sarsa-q-learning-double-q-learning/). Run the cells in order, starting with **Load the project**. To work in your own editor instead, [download the project](ex-5-6-1-project.zip).\n\nRafae     if (m && !h.id) h.id = "part-" + m[1];

  function go() {
    var t = location.hash && document.getElementById(location.hash.slice(1));
    if (t) { t.scrollIntoView(); window.scrollBy(0, -24); }   // clear of the top bar
  }
  go();
  window.addEventListener("load", function () { go(); setTimeout(go, 300); });   // after the figure has loaded
})();
</script>
</body>
</html>
